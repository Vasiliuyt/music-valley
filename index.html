<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Музыкальная Долина — Интерактивный атлас связей</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0d12;
      color: #e6e8ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    /* Верхняя панель */
    .topbar {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(16, 20, 28, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 18px;
      border-radius: 14px;
      max-width: 340px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .topbar h1 { font-size: 16px; font-weight: 700; color: #ffffff; }
    .topbar p { font-size: 12px; color: #8b94a5; line-height: 1.4; }
    .search-box {
      width: 100%;
      background: #161b26;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .search-box:focus { border-color: #6c8cff; }

    /* Легенда сцен */
    .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .legend-item:hover { background: rgba(255, 255, 255, 0.12); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Кнопка экскурсии внизу слева */
    .tour-panel {
      position: fixed;
      bottom: 20px;
      left: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 20, 28, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .btn {
      background: #232a3b;
      color: #e6e8ee;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover { background: #2f384f; }
    .btn-primary { background: #5c7cfa; color: #fff; border-color: #5c7cfa; }
    .btn-primary:hover { background: #4c6ef5; }

    /* Правая карточка артиста */
    .drawer {
      position: fixed;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 390px;
      max-width: calc(100vw - 32px);
      background: rgba(16, 20, 28, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 22px;
      z-index: 30;
      transform: translateX(440px);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
      user-select: text;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .scene-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .drawer-title { font-size: 22px; font-weight: 700; color: #fff; }
    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .close-btn:hover { background: rgba(255, 255, 255, 0.16); }
    .card-300 {
      background: rgba(255, 255, 255, 0.04);
      border-left: 3px solid #5c7cfa;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.5;
      color: #d8dde8;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #7c8599;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .story-text { font-size: 13.5px; line-height: 1.55; color: #b8c0d0; }
    .tracks-list { display: flex; flex-direction: column; gap: 6px; }
    .track-item {
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .track-year { color: #7c8599; font-size: 11px; flex-shrink: 0; }
    .links-list { display: flex; flex-direction: column; gap: 8px; }
    .link-chip {
      background: rgba(92, 124, 250, 0.1);
      border: 1px solid rgba(92, 124, 250, 0.25);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      cursor: pointer;
      transition: 0.2s;
    }
    .link-chip:hover { background: rgba(92, 124, 250, 0.22); }
    .spotify-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #1db954;
      color: #000;
      font-weight: 700;
      font-size: 13px;
      padding: 11px 16px;
      border-radius: 10px;
      text-decoration: none;
      margin-top: auto;
      transition: 0.2s;
    }
    .spotify-btn:hover { background: #1ed760; }

    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Музыкальная Долина v0.2</h1>
    <p>Кликай на кружки, перетаскивай узлы и карту, крути зум.</p>
    <input type="text" id="searchInput" class="search-box" placeholder="Найти артиста (например, Portishead)..." />
    <div class="legend" id="legend"></div>
  </div>

  <div class="tour-panel">
    <button class="btn btn-primary" id="startTourBtn">▶ Маршрут: От Чайковского до Бристоля</button>
    <button class="btn" id="nextStepBtn" style="display:none;">Следующий шаг →</button>
    <span id="tourStatus" style="font-size: 12px; color: #9aa3b5;"></span>
  </div>

  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div>
        <span class="scene-badge" id="drawerScene">Сцена</span>
        <div class="drawer-title" id="drawerTitle">Название</div>
      </div>
      <button class="close-btn" id="closeDrawer">✕</button>
    </div>

    <div class="card-300" id="drawerCard300"></div>

    <div>
      <div class="section-title">История и место в связке</div>
      <div class="story-text" id="drawerStory"></div>
    </div>

    <div>
      <div class="section-title">Точки входа (главные треки)</div>
      <div class="tracks-list" id="drawerTracks"></div>
    </div>

    <div>
      <div class="section-title">Ниточки связей (нажми для перехода)</div>
      <div class="links-list" id="drawerLinks"></div>
    </div>

    <a href="#" target="_blank" class="spotify-btn" id="spotifyLink">Открыть в Spotify ↗</a>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const SCENES = {
      classic: { name: "Академическая база", color: "#fcc419" },
      roots:   { name: "Корни и сэмплы 60–70-х", color: "#ff922b" },
      bristol: { name: "Бристоль и трип-хоп 90-х", color: "#5c7cfa" },
      hiphop:  { name: "Хип-хоп / Альтернатива", color: "#20c997" }
    };

    const NODES = [
      {
        id: "tchaikovsky", name: "П. И. Чайковский", scene: "classic", radius: 15, x: -340, y: -140,
        card300: "Воткинск, 1865 | Романтизм, классическая музыка, балет, симфония. Пётр Ильич Чайковский (композитор, дирижёр — до 1893).",
        story: "Первоисточник главной мелодии бристольского трип-хопа: в 1876 году Чайковский написал балет «Лебединое озеро», откуда через 93 года бельгийская рок-группа заимствует тему гобоя и арфы.",
        tracks: [
          { title: "Лебединое озеро: Сцена (Акт II, № 10)", year: "1876" },
          { title: "Струнный квартет № 1: Andante cantabile", year: "1871" }
        ]
      },
      {
        id: "wallace", name: "The Wallace Collection", scene: "roots", radius: 13, x: -200, y: -60,
        card300: "Брюссель, 1968 | Барокко-поп, психоделический рок. Состав: Сильвен Ванхольме, Фредди Нихоул, Рэймонд Винсент и др.",
        story: "Двое участников группы были скрипачами Бельгийского национального оркестра. В 1969 году они переложили тему из «Лебединого озера» Чайковского на рок-ритм и записали хит «Daydream».",
        tracks: [{ title: "Daydream (альбом Laughing Cavalier)", year: "1969" }]
      },
      {
        id: "hayes", name: "Айзек Хейз", scene: "roots", radius: 14, x: -70, y: 20,
        card300: "Ковингтон, 1964 | Соул, фанк, психоделический соул, саундтрек. Айзек Ли Хейз-младший (вокал, клавишные, композитор — до 2008).",
        story: "В 1971 году американский соул-легенда переиграл мелодию «Daydream» в замедленном, тягучем виде для трека «Ike's Rap II». Спустя 23 года эту пластинку найдут в Бристоле.",
        tracks: [{ title: "Ike's Rap II (альбом Black Moses)", year: "1971" }]
      },
      {
        id: "portishead", name: "Portishead", scene: "bristol", radius: 19, x: 90, y: -90,
        card300: "Бристоль, 1991 | Трип-хоп, даунтемпо, экспериментальный рок. Состав: Бет Гиббонс (вокал), Джефф Бэрроу (ударные, клавишные, сэмплы), Адриан Атли (гитара).",
