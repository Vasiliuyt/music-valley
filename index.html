<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Музыкальная Долина — Виниловый Петербург</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090c;color:#d6d8de;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;height:100vh;user-select:none}
.top{position:fixed;top:20px;left:20px;z-index:100;background:rgba(13,15,20,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);padding:16px 18px;border-radius:12px;width:320px}
.kicker{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6c7280;margin-bottom:4px}
.top h1{font-size:17px;color:#fff;margin-bottom:6px}
.top p{font-size:12px;color:#8b94a5;line-height:1.4}
.back-btn{display:none;margin-top:12px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.14);padding:7px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.back-btn:hover{background:rgba(255,255,255,.15)}
#cv{display:block;width:100vw;height:100vh}
#vinylView{position:fixed;inset:0;z-index:50;opacity:0;pointer-events:none;transition:opacity .5s ease;background:radial-gradient(circle at 50% 48%,#131620 0%,#07080b 75%)}
#vinylView.active{opacity:1;pointer-events:auto}
#vinylCv{display:block;width:100vw;height:100vh;cursor:grab}
#vinylCv:active{cursor:grabbing}
</style>
</head>
<body>
<div class="top">
  <div class="kicker" id="kicker">Audio Atlas • Сцены</div>
  <h1 id="mainTitle">Музыкальная Долина</h1>
  <p id="mainSub">Нажми на «Санкт-Петербург», чтобы открыть виниловую диораму города.</p>
  <button class="back-btn" id="backBtn">← Назад к общей схеме</button>
</div>
<canvas id="cv"></canvas>
<div id="vinylView"><canvas id="vinylCv"></canvas></div>
<script src="data.js"></script>
<script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=cv.width=innerWidth,H=cv.height=innerHeight,cx=W/2,cy=H/2,hov=null;
NODES.forEach((n,i)=>{n.x=0;n.y=i*80;n.w=220;n.h=46});

function hit(x,y){return NODES.find(n=>Math.abs(x-cx-n.x)<=n.w/2&&Math.abs(y-cy-n.y)<=n.h/2)}
cv.onmousemove=e=>{hov=hit(e.clientX,e.clientY);cv.style.cursor=hov?"pointer":"default"};
cv.onclick=e=>{const h=hit(e.clientX,e.clientY);if(h)openVinyl(h)};

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}

function loop(){
  ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(cx,cy);
  NODES.forEach(n=>{
    const isH=hov&&hov.id===n.id,rx=n.x-n.w/2,ry=n.y-n.h/2;
    if(isH){ctx.beginPath();ctx.arc(n.x,n.y,90,0,6.29);ctx.fillStyle="rgba(123,142,184,0.06)";ctx.fill()}
    rr(ctx,rx,ry,n.w,n.h,9);ctx.fillStyle=isH?"#1a1e29":"#11131a";ctx.fill();
    ctx.lineWidth=isH?1.6:1;ctx.strokeStyle=isH?"#7b8eb8":"rgba(255,255,255,0.14)";ctx.stroke();
    ctx.beginPath();ctx.arc(rx+16,n.y,4,0,6.29);ctx.fillStyle="#7b8eb8";ctx.fill();
    ctx.fillStyle="#6c7280";ctx.font="10px sans-serif";ctx.textAlign="left";ctx.fillText(n.year,rx+2,ry-6);
    ctx.fillStyle="#fff";ctx.font="600 14px sans-serif";ctx.fillText(n.name,rx+28,n.y+5);
  });
  ctx.restore();requestAnimationFrame(loop);
}
loop();

// ВИНИЛОВАЯ ДИОРАМА С ОБЪЁМНЫМИ ДОМАМИ ПИТЕРА
const vc=document.getElementById("vinylCv"),vx=vc.getContext("2d");
let vox=0,voy=25,vsc=1,vdrag=false,vlx=0,vly=0,ang=0;
onresize=()=>{W=cv.width=vc.width=innerWidth;H=cv.height=vc.height=innerHeight;cx=W/2;cy=H/2};
vc.width=W;vc.height=H;

vc.onmousedown=e=>{vdrag=true;vlx=e.clientX;vly=e.clientY};
window.addEventListener("mousemove",e=>{if(!vdrag)return;vox+=e.clientX-vlx;voy+=e.clientY-vly;vlx=e.clientX;vly=e.clientY});
window.addEventListener("mouseup",()=>{vdrag=false});
vc.onwheel=e=>{e.preventDefault();vsc=Math.min(2.2,Math.max(0.65,vsc*(e.deltaY<0?1.1:0.9)))};

function drawIsoBox(x,y,w,d,h,colTop,colLeft,colRight,lbl){
  vx.save();
  // Тень на виниле
  vx.fillStyle="rgba(0,0,0,0.45)";
  vx.beginPath();vx.ellipse(x+w*0.3,y+6,w*0.9,d*0.45,0,0,6.29);vx.fill();
  // Левая грань
  vx.fillStyle=colLeft;vx.beginPath();vx.moveTo(x-w,y);vx.lineTo(x,y+d);vx.lineTo(x,y+d-h);vx.lineTo(x-w,y-h);vx.closePath();vx.fill();
  // Правая грань
  vx.fillStyle=colRight;vx.beginPath();vx.moveTo(x,y+d);vx.lineTo(x+w,y);vx.lineTo(x+w,y-h);vx.lineTo(x,y+d-h);vx.closePath();vx.fill();
  // Крыша
  vx.fillStyle=colTop;vx.beginPath();vx.moveTo(x,y-d-h);vx.lineTo(x+w,y-h);vx.lineTo(x,y+d-h);vx.lineTo(x-w,y-h);vx.closePath();vx.fill();
  if(lbl){vx.fillStyle="#9aa3b8";vx.font="600 10px sans-serif";vx.textAlign="center";vx.fillText(lbl,x,y-d-h-8)}
  vx.restore();
}

function drawVinyl(){
  ang+=0.002;
  vx.clearRect(0,0,W,H);
  vx.save();vx.translate(W/2+vox,H/2+voy);vx.scale(vsc,vsc);

  // 3D-толщина и тень диска
  vx.fillStyle="rgba(0,0,0,0.75)";
  vx.beginPath();vx.ellipse(0,22,430,235,0,0,6.29);vx.fill();
  vx.fillStyle="#141720";
  vx.beginPath();vx.ellipse(0,10,425,230,0,0,6.29);vx.fill();

  // Поверхность виниловой пластинки (изометрия)
  const g=vx.createRadialGradient(-60,-30,20,0,0,430);
  g.addColorStop(0,"#1c202c");g.addColorStop(0.5,"#0e1016");g.addColorStop(1,"#161923");
  vx.fillStyle=g;
  vx.beginPath();vx.ellipse(0,0,425,230,0,0,6.29);vx.fill();
  vx.strokeStyle="rgba(255,255,255,0.12)";vx.lineWidth=1.5;vx.stroke();

  // Звуковые дорожки + световой блик винила
  for(let r=125;r<410;r+=11){
    vx.beginPath();vx.ellipse(0,0,r,r*0.54,0,0,6.29);
    vx.strokeStyle=r%33===0?"rgba(255,255,255,0.06)":"rgba(255,255,255,0.025)";
    vx.lineWidth=1;vx.stroke();
  }
  // Блик света по диагонали
  vx.save();vx.beginPath();vx.ellipse(0,0,422,228,0,0,6.29);vx.clip();
  vx.fillStyle="rgba(255,255,255,0.025)";
  vx.beginPath();vx.moveTo(0,0);vx.lineTo(-260,-220);vx.lineTo(-110,-240);vx.closePath();vx.fill();
  vx.beginPath();vx.moveTo(0,0);vx.lineTo(260,220);vx.lineTo(110,240);vx.closePath();vx.fill();

  // Река Нева, разрезающая дорожки винила
  vx.strokeStyle="#07090e";vx.lineWidth=28;vx.lineCap="round";
  vx.beginPath();vx.moveTo(-430,45);vx.bezierCurveTo(-180,25,-60,-25,90,-15);vx.bezierCurveTo(220,-5,310,45,440,85);vx.stroke();
  vx.strokeStyle="rgba(123,142,184,0.22)";vx.lineWidth=1.5;vx.stroke();
  vx.restore();

  // Яблоко пластинки (Центр / Стрелка В.О.)
  vx.fillStyle="#1f2536";vx.beginPath();vx.ellipse(0,0,105,57,0,0,6.29);vx.fill();
  vx.strokeStyle="#c4a35a";vx.lineWidth=1.5;vx.stroke();
  vx.fillStyle="#c4a35a";vx.font="700 9px sans-serif";vx.textAlign="center";
  vx.fillText("LENINGRAD • ST. PETERSBURG",0,-18);
  vx.fillStyle="#08090c";vx.beginPath();vx.ellipse(0,0,12,6.5,0,0,6.29);vx.fill();

  // ОБЪЁМНЫЕ 3D-ДОМА И ЗНАКОВЫЕ МЕСТА НА ПЛАСТИНКЕ
  // 1. Портальные краны Севкабеля (запад)
  drawIsoBox(-285,35,24,13,34,"#2c3347","#1d2230","#141822","СЕВКАБЕЛЬ");
  // 2. Васильевский остров / Стрелка
  drawIsoBox(-145,55,32,17,28,"#32394f","#212636","#171b26","ВАСИЛЬЕВСКИЙ");
  // 3. Петропавловка и котельная Камчатка (север)
  drawIsoBox(-55,-75,26,14,42,"#3a4159","#252b3b","#1a1e2b","ПЕТРОГРАДКА / КАМЧАТКА");
  vx.strokeStyle="#c4a35a";vx.lineWidth=2;vx.beginPath();vx.moveTo(-55,-131);vx.lineTo(-55,-168);vx.stroke();
  // 4. Разведённый Дворцовый мост над Невой
  vx.strokeStyle="#8c96ab";vx.lineWidth=3.5;
  vx.beginPath();vx.moveTo(-38,8);vx.lineTo(-20,-14);vx.stroke();
  vx.beginPath();vx.moveTo(4,2);vx.lineTo(-12,-16);vx.stroke();
  // 5. Рубинштейна 13 / Рок-клуб (центр)
  drawIsoBox(65,68,36,19,38,"#363e54","#222838","#171b26","РУБИНШТЕЙНА, 13");
  drawIsoBox(125,45,28,15,52,"#2d3447","#1d2230","#131721","ЛИГОВКА");
  // 6. Охта / Выборгская
  drawIsoBox(225,-35,30,16,30,"#2a3042","#1b202e","#121620","ВЫБОРГСКАЯ");

  // Тонарм и игла проигрывателя справа сверху
  vx.save();vx.translate(390,-185);
  vx.fillStyle="#222736";vx.beginPath();vx.arc(0,0,28,0,6.29);vx.fill();
  vx.strokeStyle="#5c6478";vx.lineWidth=2;vx.stroke();
  vx.strokeStyle="#9aa3b8";vx.lineWidth=5;vx.lineCap="round";
  vx.beginPath();vx.moveTo(0,0);vx.lineTo(-95,85);vx.lineTo(-145,155);vx.stroke();
  vx.fillStyle="#c4a35a";vx.fillRect(-155,150,18,10);
  vx.restore();

  vx.restore();
  requestAnimationFrame(drawVinyl);
}
drawVinyl();

function openVinyl(city){
  document.getElementById("vinylView").classList.add("active");
  document.getElementById("kicker").textContent="Виниловая диорама • "+city.year;
  document.getElementById("mainTitle").textContent=city.name;
  document.getElementById("mainSub").textContent="Тяни мышкой, крути колесико. Скоро здесь оживут точки групп.";
  document.getElementById("backBtn").style.display="inline-block";
}
document.getElementById("backBtn").onclick=()=>{
  document.getElementById("vinylView").classList.remove("active");
  document.getElementById("kicker").textContent="Audio Atlas • Сцены";
  document.getElementById("mainTitle").textContent="Музыкальная Долина";
  document.getElementById("mainSub").textContent="Нажми на «Санкт-Петербург», чтобы открыть виниловую диораму города.";
  document.getElementById("backBtn").style.display="none";
};
</script>
</body>
</html>
