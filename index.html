<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Музыкальная Долина — Виниловый Петербург</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090c;color:#d6d8de;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;height:100vh;user-select:none}
.top{position:fixed;top:20px;left:20px;z-index:100;background:rgba(13,15,20,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);padding:16px 18px;border-radius:12px;width:300px;transition:.3s}
.top.compact{width:auto;padding:10px 14px;background:rgba(13,15,20,.75)}
.kicker{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6c7280;margin-bottom:4px}
.top h1{font-size:17px;color:#fff;margin-bottom:6px}
.top p{font-size:12px;color:#8b94a5;line-height:1.4}
.back-btn{display:none;background:transparent;color:#d6d8de;border:none;font-size:12.5px;font-weight:600;cursor:pointer}
.back-btn:hover{color:#fff}
#cv{display:block;width:100vw;height:100vh}
#vinylView{position:fixed;inset:0;z-index:50;opacity:0;pointer-events:none;transition:opacity .5s ease;background:radial-gradient(circle at 50% 48%,#131620 0%,#06070a 78%)}
#vinylView.active{opacity:1;pointer-events:auto}
#vinylCv{display:block;width:100vw;height:100vh;cursor:grab}
#vinylCv:active{cursor:grabbing}
</style>
</head>
<body>
<div class="top" id="topBox">
  <div class="kicker" id="kicker">Audio Atlas • Сцены</div>
  <h1 id="mainTitle">Музыкальная Долина</h1>
  <p id="mainSub">Нажми на «Санкт-Петербург», чтобы открыть сцену.</p>
  <button class="back-btn" id="backBtn">← Назад к схеме</button>
</div>
<canvas id="cv"></canvas>
<div id="vinylView"><canvas id="vinylCv"></canvas></div>

<script src="data.js"></script>
<script src="revers.js?v=2"></script>
<script src="kollekcioner.js?v=3"></script>
<script src="vinyl.js"></script>
<script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=cv.width=innerWidth,H=cv.height=innerHeight,cx=W/2,cy=H/2,hov=null;
NODES.forEach((n,i)=>{n.x=0;n.y=i*80;n.w=220;n.h=46});
function hit(x,y){return NODES.find(n=>Math.abs(x-cx-n.x)<=n.w/2&&Math.abs(y-cy-n.y)<=n.h/2)}
cv.onmousemove=e=>{hov=hit(e.clientX,e.clientY);cv.style.cursor=hov?"pointer":"default"};
cv.onclick=e=>{const h=hit(e.clientX,e.clientY);if(h)openVinyl(h)};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}
function loop(){
  ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(cx,cy);
  NODES.forEach(n=>{
    const isH=hov&&hov.id===n.id,rx=n.x-n.w/2,ry=n.y-n.h/2;
    if(isH){ctx.beginPath();ctx.arc(n.x,n.y,90,0,6.29);ctx.fillStyle="rgba(123,142,184,0.06)";ctx.fill()}
    rr(ctx,rx,ry,n.w,n.h,9);ctx.fillStyle=isH?"#1a1e29":"#11131a";ctx.fill();
    ctx.lineWidth=isH?1.6:1;ctx.strokeStyle=isH?"#7b8eb8":"rgba(255,255,255,0.14)";ctx.stroke();
    ctx.beginPath();ctx.arc(rx+16,n.y,4,0,6.29);ctx.fillStyle="#7b8eb8";ctx.fill();
    ctx.fillStyle="#6c7280";ctx.font="10px sans-serif";ctx.textAlign="left";ctx.fillText(n.year,rx+2,ry-6);
    ctx.fillStyle="#fff";ctx.font="600 14px sans-serif";ctx.fillText(n.name,rx+28,n.y+5);
  });
  ctx.restore();requestAnimationFrame(loop);
}
loop();
function openVinyl(city){
  document.getElementById("vinylView").classList.add("active");
  document.getElementById("topBox").classList.add("compact");
  document.getElementById("kicker").style.display="none";
  document.getElementById("mainTitle").style.display="none";
  document.getElementById("mainSub").style.display="none";
  document.getElementById("backBtn").style.display="inline-block";
}
document.getElementById("backBtn").onclick=()=>{
  document.getElementById("vinylView").classList.remove("active");
  document.getElementById("topBox").classList.remove("compact");
  document.getElementById("kicker").style.display="block";
  document.getElementById("mainTitle").style.display="block";
  document.getElementById("mainSub").style.display="block";
  document.getElementById("backBtn").style.display="none";
};
</script>
</body>
</html>
