<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Музыкальная Долина — Архив связей</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090a0d;color:#d6d8de;font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;height:100vh}
.grain{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.035;background-image:radial-gradient(#fff 1px,transparent 0);background-size:24px 24px}
.top{position:fixed;top:20px;left:20px;z-index:10;background:rgba(13,15,20,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.07);padding:16px 18px;border-radius:12px;width:340px}
.top-kicker{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#6c7280;margin-bottom:4px;font-weight:600}
.top h1{font-size:17px;font-weight:600;letter-spacing:-.2px;color:#f2f3f7;margin-bottom:10px}
.search{width:100%;background:#111319;border:1px solid rgba(255,255,255,.08);color:#e6e8ee;padding:8px 11px;border-radius:7px;font-size:12px;margin-bottom:12px;outline:none;transition:.2s}
.search:focus{border-color:rgba(255,255,255,.25)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.leg{font-size:11px;color:#9da3b0;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);padding:4px 9px;border-radius:5px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:.2s}
.leg:hover,.leg.active{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(255,255,255,.18)}
.dot{width:6px;height:6px;border-radius:50%}
.tour{position:fixed;bottom:20px;left:20px;z-index:10;background:rgba(13,15,20,.88);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.07);padding:9px 12px;border-radius:10px;display:flex;gap:8px;align-items:center}
button{background:#e6e8ee;color:#090a0d;border:none;padding:7px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
button:hover{background:#ffffff}
button.sec{background:rgba(255,255,255,.06);color:#c4c8d4;border:1px solid rgba(255,255,255,.08)}
button.sec:hover{background:rgba(255,255,255,.12);color:#fff}
.card{position:fixed;top:20px;right:20px;bottom:20px;width:420px;max-width:calc(100vw - 40px);background:rgba(13,15,20,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px;z-index:20;display:none;flex-direction:column;gap:16px;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.75)}
.card.open{display:flex}
.badge{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.1px;padding:3px 8px;border-radius:4px;margin-bottom:6px;border:1px solid rgba(255,255,255,.1)}
.c300{background:rgba(255,255,255,.025);border-left:2px solid #8c96ab;padding:12px 14px;border-radius:4px;font-size:13px;line-height:1.5;color:#cfd4e0}
.sec-t{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#666c7a;font-weight:600;margin-bottom:8px}
.fact-list{padding-left:15px;font-size:13px;line-height:1.55;color:#aeb4c2;display:flex;flex-direction:column;gap:8px}
.trk{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);padding:9px 12px;border-radius:6px;font-size:12.5px;margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.trk span:last-child{color:#6c7280;font-size:11px;flex-shrink:0}
.lnk{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);padding:9px 12px;border-radius:6px;font-size:12px;margin-top:6px;cursor:pointer;transition:.2s}
.lnk:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.sp{background:#181b22;color:#e6e8ee;border:1px solid rgba(255,255,255,.14);text-align:center;padding:11px;border-radius:8px;text-decoration:none;font-weight:600;font-size:12.5px;margin-top:auto;transition:.2s}
.sp:hover{background:#1db954;color:#000;border-color:#1db954}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<div class="grain"></div>
<div class="top">
  <div class="top-kicker">Audio Archive • v0.6</div>
  <h1>Музыкальная Долина</h1>
  <input id="q" class="search" placeholder="Поиск по архиву...">
  <div class="legend" id="leg"></div>
</div>
<div class="tour">
  <button id="tStart">▶ Маршрут: Чайковский → Бристоль</button>
  <button id="tNext" class="sec" style="display:none">Далее →</button>
  <span id="tInfo" style="font-size:11px;color:#6c7280;font-variant-numeric:tabular-nums"></span>
</div>
<div class="card" id="card">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
    <div>
      <span class="badge" id="cBadge"></span>
      <h2 id="cTitle" style="font-size:22px;font-weight:600;color:#fff;letter-spacing:-.3px"></h2>
    </div>
    <button class="sec" onclick="document.getElementById('card').classList.remove('open');act=null">✕</button>
  </div>
  <div class="c300" id="c300"></div>
  <div><div class="sec-t">Документальные факты</div><ul class="fact-list" id="cFacts"></ul></div>
  <div><div class="sec-t">Ключевые записи</div><div id="cTrk"></div></div>
  <div><div class="sec-t">Связи в архиве</div><div id="cLnk"></div></div>
  <a id="cSp" href="#" target="_blank" class="sp">Слушать в Spotify ↗</a>
</div>
<canvas id="cv"></canvas>

<script src="data.js"></script>
<script>
const NOIR_PALETTE = {
  classic: "#c4a35a",
  roots:   "#b87a56",
  bristol: "#7b8eb8",
  hiphop:  "#6fa396"
};

const sorted = [...NODES].sort((a,b) => a.year - b.year);
const lanes = [-160, -55, 50, 155, -105, 105];
sorted.forEach((n, i) => {
  n.x = -420 + i * 125;
  n.y = lanes[i % lanes.length];
  n.w = Math.max(120, n.name.length * 8.2 + 34);
  n.h = 34;
});

const M = {}; NODES.forEach(x => M[x.id] = x);
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W = cv.width = innerWidth, H = cv.height = innerHeight;
let cx = W / 2, cy = H / 2, sc = 1, drag = null, pan = false, lx = 0, ly = 0, act = null, hov = null, query = "", filterScene = null;

onresize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
function hit(x, y) {
  const wx = (x - cx) / sc, wy = (y - cy) / sc;
  return NODES.find(n => Math.abs(wx - n.x) <= n.w / 2 && Math.abs(wy - n.y) <= n.h / 2);
}

cv.onmousedown = e => {
  const h = hit(e.clientX, e.clientY); lx = e.clientX; ly = e.clientY;
  if (h) { drag = h; drag.m = false; } else pan = true;
};
onmousemove = e => {
  if (drag) { drag.x += (e.clientX - lx) / sc; drag.y += (e.clientY - ly) / sc; drag.m = true; lx = e.clientX; ly = e.clientY; }
  else if (pan) { cx += e.clientX - lx; cy += e.clientY - ly; lx = e.clientX; ly = e.clientY; }
  else { hov = hit(e.clientX, e.clientY); cv.style.cursor = hov ? "pointer" : "grab"; }
};
onmouseup = () => { if (drag && !drag.m) show(drag); drag = null; pan = false; };
cv.onwheel = e => {
  e.preventDefault();
  const ns = Math.min(2.6, Math.max(0.4, sc * (e.deltaY < 0 ? 1.1 : 0.9)));
  const wx = (e.clientX - cx) / sc, wy = (e.clientY - cy) / sc;
  sc = ns; cx = e.clientX - wx * sc; cy = e.clientY - wy * sc;
};

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
  const foc = hov || act;

  // Плавные кривые Безье вместо прямых линий
  LINKS.forEach(l => {
    const a = M[l.source], b = M[l.target];
    if (!a || !b) return;
    const hi = foc && (foc.id === a.id || foc.id === b.id);
    const col = NOIR_PALETTE[a.scene] || "#7b8eb8";
    const midX = (a.x + b.x) / 2;

    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.bezierCurveTo(midX, a.y, midX, b.y, b.x, b.y);
    ctx.strokeStyle = hi ? col : "rgba(255,255,255,0.1)";
    ctx.lineWidth = hi ? 2 : 1;
    ctx.stroke();

    if (hi) {
      ctx.fillStyle = "#c8cdd8";
      ctx.font = "10.5px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(l.label, midX, (a.y + b.y) / 2 - 7);
    }
  });

  // Карточки-капсулы вместо кружков
  NODES.forEach(n => {
    const col = NOIR_PALETTE[n.scene] || "#8c96ab";
    const matchQ = !query || n.name.toLowerCase().includes(query);
    const matchS = !filterScene || n.scene === filterScene;
    const isSel = foc && foc.id === n.id;

    ctx.globalAlpha = (matchQ && matchS) ? 1 : 0.18;

    const rx = n.x - n.w / 2, ry = n.y - n.h / 2;
    roundRect(rx, ry, n.w, n.h, 7);
    ctx.fillStyle = isSel ? "#1b1f2b" : "#11131a";
    ctx.fill();
    ctx.lineWidth = isSel ? 1.6 : 1;
    ctx.strokeStyle = isSel ? col : "rgba(255,255,255,0.11)";
    ctx.stroke();

    // Акцентная точка слева внутри плашки
    ctx.beginPath();
    ctx.arc(rx + 13, n.y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();

    // Год мелким шрифтом над плашкой
    ctx.fillStyle = "#5c6270";
    ctx.font = "9.5px -apple-system, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(n.year, rx + 2, ry - 5);

    // Имя артиста внутри плашки
    ctx.fillStyle = isSel ? "#ffffff" : "#dcdfe8";
    ctx.font = "500 12.5px -apple-system, sans-serif";
    ctx.fillText(n.name, rx + 23, n.y + 4);
  });

  ctx.restore();
  requestAnimationFrame(loop);
}
loop();

function show(n) {
  act = n;
  const scObj = SCENES[n.scene];
  const col = NOIR_PALETTE[n.scene] || "#8c96ab";
  const b = document.getElementById("cBadge");
  b.textContent = scObj.name + " • " + n.year;
  b.style.color = col;
  b.style.borderColor = col + "55";
  document.getElementById("cTitle").textContent = n.name;
  document.getElementById("c300").textContent = n.card300;
