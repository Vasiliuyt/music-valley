<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Музыкальная Долина — Виниловый Петербург</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090c;color:#d6d8de;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;height:100vh;user-select:none}
.top{position:fixed;top:20px;left:20px;z-index:100;background:rgba(13,15,20,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);padding:16px 18px;border-radius:12px;width:300px;transition:.3s}
.top.compact{width:auto;padding:10px 14px;background:rgba(13,15,20,.75)}
.kicker{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6c7280;margin-bottom:4px}
.top h1{font-size:17px;color:#fff;margin-bottom:6px}
.top p{font-size:12px;color:#8b94a5;line-height:1.4}
.back-btn{display:none;background:transparent;color:#d6d8de;border:none;font-size:12.5px;font-weight:600;cursor:pointer}
.back-btn:hover{color:#fff}
#cv{display:block;width:100vw;height:100vh}
#vinylView{position:fixed;inset:0;z-index:50;opacity:0;pointer-events:none;transition:opacity .5s ease;background:radial-gradient(circle at 50% 48%,#131620 0%,#06070a 78%)}
#vinylView.active{opacity:1;pointer-events:auto}
#vinylCv{display:block;width:100vw;height:100vh;cursor:grab}
#vinylCv:active{cursor:grabbing}
</style>
</head>
<body>
<div class="top" id="topBox">
  <div class="kicker" id="kicker">Audio Atlas • Сцены</div>
  <h1 id="mainTitle">Музыкальная Долина</h1>
  <p id="mainSub">Нажми на «Санкт-Петербург», чтобы открыть сцену.</p>
  <button class="back-btn" id="backBtn">← Назад к схеме</button>
</div>
<canvas id="cv"></canvas>
<div id="vinylView"><canvas id="vinylCv"></canvas></div>
<script src="data.js"></script>
<script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=cv.width=innerWidth,H=cv.height=innerHeight,cx=W/2,cy=H/2,hov=null;
NODES.forEach((n,i)=>{n.x=0;n.y=i*80;n.w=220;n.h=46});

function hit(x,y){return NODES.find(n=>Math.abs(x-cx-n.x)<=n.w/2&&Math.abs(y-cy-n.y)<=n.h/2)}
cv.onmousemove=e=>{hov=hit(e.clientX,e.clientY);cv.style.cursor=hov?"pointer":"default"};
cv.onclick=e=>{const h=hit(e.clientX,e.clientY);if(h)openVinyl(h)};

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}

function loop(){
  ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(cx,cy);
  NODES.forEach(n=>{
    const isH=hov&&hov.id===n.id,rx=n.x-n.w/2,ry=n.y-n.h/2;
    if(isH){ctx.beginPath();ctx.arc(n.x,n.y,90,0,6.29);ctx.fillStyle="rgba(123,142,184,0.06)";ctx.fill()}
    rr(ctx,rx,ry,n.w,n.h,9);ctx.fillStyle=isH?"#1a1e29":"#11131a";ctx.fill();
    ctx.lineWidth=isH?1.6:1;ctx.strokeStyle=isH?"#7b8eb8":"rgba(255,255,255,0.14)";ctx.stroke();
    ctx.beginPath();ctx.arc(rx+16,n.y,4,0,6.29);ctx.fillStyle="#7b8eb8";ctx.fill();
    ctx.fillStyle="#6c7280";ctx.font="10px sans-serif";ctx.textAlign="left";ctx.fillText(n.year,rx+2,ry-6);
    ctx.fillStyle="#fff";ctx.font="600 14px sans-serif";ctx.fillText(n.name,rx+28,n.y+5);
  });
  ctx.restore();requestAnimationFrame(loop);
}
loop();

const vc=document.getElementById("vinylCv"),vx=vc.getContext("2d");
let vox=0,voy=20,vsc=1,vdrag=false,vlx=0,vly=0;
onresize=()=>{W=cv.width=vc.width=innerWidth;H=cv.height=vc.height=innerHeight;cx=W/2;cy=H/2};
vc.width=W;vc.height=H;

vc.onmousedown=e=>{vdrag=true;vlx=e.clientX;vly=e.clientY};
window.addEventListener("mousemove",e=>{if(!vdrag)return;vox+=e.clientX-vlx;voy+=e.clientY-vly;vlx=e.clientX;vly=e.clientY});
window.addEventListener("mouseup",()=>{vdrag=false});
vc.onwheel=e=>{e.preventDefault();vsc=Math.min(2.4,Math.max(0.65,vsc*(e.deltaY<0?1.1:0.9)))};

const TILT=0.55;
function pt(r,a){return {x:Math.cos(a)*r,y:Math.sin(a)*r*TILT}}

// Каналы и улицы, идущие по радиусу и дугам винила с лёгким волновым изгибом
const RING_CHANNELS=[
  {r:215,w:13,amp:7,freq:3,phase:0.4},
  {r:325,w:11,amp:9,freq:4,phase:1.8}
];
const RING_STREETS=[162,272,378];
const RADIAL_STREETS=[0.22,1.15,2.05,2.92,3.85,4.78,5.65];

function canalRadius(c,a){return c.r+Math.sin(a*c.freq+c.phase)*c.amp}

function isBlocked(r,a){
  const na=((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  // Кольцевые каналы
  for(const c of RING_CHANNELS){
    if(Math.abs(r-canalRadius(c,na))<c.w*0.5+9) return true;
  }
  // Кольцевые улицы (прорези между кварталами по радиусу винила)
  for(const sr of RING_STREETS){
    if(Math.abs(r-sr)<8) return true;
  }
  // Радиальные улицы и протоки
  for(let i=0;i<RADIAL_STREETS.length;i++){
    const sa=RADIAL_STREETS[i]+Math.sin(r*0.016+i)*0.07;
    if(Math.abs(na-sa)<(i===0||i===3?0.12:0.065)) return true;
  }
  return false;
}

const HOUSES=[];
let seed=77;
function rnd(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}

// Генерируем дома в монохромном стиле: разная длина, ширина, высота и лёгкая хаотичность вдоль колец
for(let rBase=132;rBase<=410;rBase+=13){
  const count=Math.floor(rBase*0.2);
  for(let i=0;i<count;i++){
    if(rnd()<0.3) continue; // просветы между домами
    const a=(i/count)*Math.PI*2+(rnd()-0.5)*0.08;
    const r=rBase+(rnd()-0.5)*9;
    if(r<128||r>415||isBlocked(r,a)) continue;
    const pos=pt(r,a);
    HOUSES.push({
      x:pos.x,y:pos.y,
      w:5+rnd()*13, // разная длина вдоль дуги
      d:3.5+rnd()*5.5, // разная глубина
      h:7+rnd()*24*(1-(r-125)/380), // разная высота
      ang:a+Math.PI/2+(rnd()-0.5)*0.28 // лёгкий хаотичный поворот вдоль радиуса
    });
  }
}
HOUSES.sort((a,b)=>a.y-b.y);

function drawHouse(b){
  const c=Math.cos(b.ang),s=Math.sin(b.ang)*TILT;
  const dx1=c*b.w,dy1=s*b.w;
  const dx2=-Math.sin(b.ang)*b.d,dy2=Math.cos(b.ang)*b.d*TILT;
  const p1={x:b.x-dx1-dx2,y:b.y-dy1-dy2};
  const p2={x:b.x+dx1-dx2,y:b.y+dy1-dy2};
  const p3={x:b.x+dx1+dx2,y:b.y+dy1+dy2};
  const p4={x:b.x-dx1+dx2,y:b.y-dy1+dy2};

  // Мягкая тень на виниле
  vx.fillStyle="rgba(0,0,0,0.45)";
  vx.beginPath();vx.moveTo(p1.x+3,p1.y+3);vx.lineTo(p2.x+3,p2.y+3);vx.lineTo(p3.x+3,p3.y+3);vx.lineTo(p4.x+3,p4.y+3);vx.closePath();vx.fill();

  // Единый монохромный оттенок для всех домов (разница только в освещении граней)
  vx.fillStyle="#1c212e";
  vx.beginPath();vx.moveTo(p4.x,p4.y);vx.lineTo(p3.x,p3.y);vx.lineTo(p3.x,p3.y-b.h);vx.lineTo(p4.x,p4.y-b.h);vx.closePath();vx.fill();

  vx.fillStyle="#141822";
  vx.beginPath();vx.moveTo(p3.x,p3.y);vx.lineTo(p2.x,p2.y);vx.lineTo(p2.x,p2.y-b.h);vx.lineTo(p3.x,p3.y-b.h);vx.closePath();vx.fill();

  // Крыша + тонкая обводка, чтобы каждый дом чётко читался
  vx.fillStyle="#282f40";
  vx.beginPath();vx.moveTo(p1.x,p1.y-b.h);vx.lineTo(p2.x,p2.y-b.h);vx.lineTo(p3.x,p3.y-b.h);vx.lineTo(p4.x,p4.y-b.h);vx.closePath();vx.fill();
  vx.strokeStyle="rgba(255,255,255,0.11)";
  vx.lineWidth=0.65;
  vx.stroke();
}

function drawVinyl(){
  vx.clearRect(0,0,W,H);
  vx.save();vx.translate(W/2+vox,H/2+voy);vx.scale(vsc,vsc);

  // Тень и 3D-торец винила
  vx.fillStyle="rgba(0,0,0,0.82)";
  vx.beginPath();vx.ellipse(0,22,445,445*TILT,0,0,6.29);vx.fill();
  vx.fillStyle="#141720";
  vx.beginPath();vx.ellipse(0,10,440,440*TILT,0,0,6.29);vx.fill();

  // Базовый диск винила
  const g=vx.createRadialGradient(-40,-20,30,0,0,440);
  g.addColorStop(0,"#1a1e29");g.addColorStop(0.55,"#0d0f15");g.addColorStop(1,"#151822");
  vx.fillStyle=g;
  vx.beginPath();vx.ellipse(0,0,440,440*TILT,0,0,6.29);vx.fill();
  vx.strokeStyle="rgba(255,255,255,0.13)";vx.lineWidth=1.5;vx.stroke();

  // Звуковые дорожки
  for(let r=122;r<428;r+=9){
    vx.beginPath();vx.ellipse(0,0,r,r*TILT,0,0,6.29);
    vx.strokeStyle=r%27===0?"rgba(255,255,255,0.055)":"rgba(255,255,255,0.02)";
    vx.lineWidth=1;vx.stroke();
  }

  // Каналы и радиальные протоки (идут по кругу и радиусам с плавным изгибом)
  vx.save();vx.beginPath();vx.ellipse(0,0,437,437*TILT,0,0,6.29);vx.clip();
  RING_CHANNELS.forEach(c=>{
    vx.beginPath();
    for(let a=0;a<=6.32;a+=0.05){
      const p=pt(canalRadius(c,a),a);
      a===0?vx.moveTo(p.x,p.y):vx.lineTo(p.x,p.y);
    }
    vx.strokeStyle="#06070a";vx.lineWidth=c.w;vx.stroke();
    vx.strokeStyle="rgba(123,142,184,0.16)";vx.lineWidth=0.9;vx.stroke();
  });
  [0,3].forEach(idx=>{
    vx.beginPath();
    for(let r=112;r<=442;r+=10){
      const a=RADIAL_STREETS[idx]+Math.sin(r*0.016+idx)*0.07;
      const p=pt(r,a);
      r===112?vx.moveTo(p.x,p.y):vx.lineTo(p.x,p.y);
    }
    vx.strokeStyle="#06070a";vx.lineWidth=18;vx.stroke();
    vx.strokeStyle="rgba(123,142,184,0.18)";vx.lineWidth=0.9;vx.stroke();
  });
  vx.restore();

  // Пустое центральное яблоко пластинки
  vx.fillStyle="#151923";vx.beginPath();vx.ellipse(0,0,112,112*TILT,0,0,6.29);vx.fill();
  vx.strokeStyle="rgba(196,163,90,0.45)";vx.lineWidth=1.2;vx.stroke();
  vx.fillStyle="#07080b";vx.beginPath();vx.ellipse(0,0,11,11*TILT,0,0,6.29);vx.fill();

  // Монохромная живая застройка вдоль улиц и каналов
  HOUSES.forEach(drawHouse);

  vx.restore();
  requestAnimationFrame(drawVinyl);
}
drawVinyl();

function openVinyl(city){
  document.getElementById("vinylView").classList.add("active");
  document.getElementById("topBox").classList.add("compact");
  document.getElementById("kicker").style.display="none";
  document.getElementById("mainTitle").style.display="none";
  document.getElementById("mainSub").style.display="none";
  document.getElementById("backBtn").style.display="inline-block";
}
document.getElementById("backBtn").onclick=()=>{
  document.getElementById("vinylView").classList.remove("active");
  document.getElementById("topBox").classList.remove("compact");
  document.getElementById("kicker").style.display="block";
  document.getElementById("mainTitle").style.display="block";
  document.getElementById("mainSub").style.display="block";
  document.getElementById("backBtn").style.display="none";
};
</script>
</body>
</html>
