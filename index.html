<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Музыкальная Долина — Санкт-Петербург</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090a0d;color:#d6d8de;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;height:100vh;user-select:none}
.top{position:fixed;top:20px;left:20px;z-index:100;background:rgba(13,15,20,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);padding:16px 18px;border-radius:12px;width:320px}
.kicker{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6c7280;margin-bottom:4px}
.top h1{font-size:17px;color:#fff;margin-bottom:6px}
.top p{font-size:12px;color:#8b94a5;line-height:1.4}
.back-btn{display:none;margin-top:12px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.14);padding:7px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.back-btn:hover{background:rgba(255,255,255,.15)}
#cv{display:block;width:100vw;height:100vh}
#mapView{position:fixed;inset:0;z-index:50;opacity:0;pointer-events:none;transition:opacity .45s ease;background:#090a0d;display:flex;align-items:center;justify-content:center}
#mapView.active{opacity:1;pointer-events:auto}
#spbSvg{width:100vw;height:100vh;cursor:grab}
#spbSvg:active{cursor:grabbing}
.district{fill:#11141c;stroke:#232838;stroke-width:1.5;transition:.25s}
.district:hover{fill:#161b26}
.water{fill:#07090e}
.road{fill:none;stroke:#2b3245;stroke-width:2.5;stroke-linecap:round}
.bridge{stroke:#4c5670;stroke-width:3.5}
.lbl{fill:#525a6e;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;pointer-events:none}
.water-lbl{fill:#263047;font-size:11px;font-style:italic;letter-spacing:2px;pointer-events:none}
</style>
</head>
<body>
<div class="top">
  <div class="kicker" id="kicker">Audio Atlas • Сцены</div>
  <h1 id="mainTitle">Музыкальная Долина</h1>
  <p id="mainSub">Нажми на «Санкт-Петербург», чтобы открыть интерактивную карту города.</p>
  <button class="back-btn" id="backBtn">← Назад к общей схеме</button>
</div>
<canvas id="cv"></canvas>
<div id="mapView">
  <svg id="spbSvg" viewBox="0 0 1200 800">
    <g id="mapLayer">
      <!-- Финский залив и реки -->
      <rect x="-400" y="-400" width="2000" height="1600" class="water"/>
      <text x="120" y="380" class="water-lbl">ФИНСКИЙ ЗАЛИВ</text>

      <!-- Приморский / Северо-Запад -->
      <path d="M 220,40 L 680,40 L 650,210 L 380,230 L 240,190 Z" class="district"/>
      <text x="410" y="135" class="lbl">Приморский / Чёрная речка</text>

      <!-- Выборгский / Калининский -->
      <path d="M 700,40 L 1120,40 L 1120,310 L 730,300 L 675,210 Z" class="district"/>
      <text x="830" y="165" class="lbl">Выборгский / Лесная</text>

      <!-- Петроградская сторона -->
      <path d="M 410,255 L 645,235 L 665,355 L 490,375 L 400,320 Z" class="district"/>
      <text x="465" y="310" class="lbl">Петроградская сторона</text>

      <!-- Крестовский и Елагин острова -->
      <path d="M 250,235 L 385,245 L 380,310 L 245,300 Z" class="district"/>

      <!-- Васильевский остров -->
      <path d="M 260,365 L 475,395 L 495,470 L 265,485 Z" class="district"/>
      <text x="305" y="435" class="lbl">Васильевский остров</text>

      <!-- Центральный / Адмиралтейский -->
      <path d="M 520,405 L 870,385 L 910,630 L 450,620 L 485,495 Z" class="district"/>
      <text x="615" y="485" class="lbl">Центр / Лиговка / Рубинштейна</text>

      <!-- Красногвардейский / Охта -->
      <path d="M 900,340 L 1140,340 L 1140,640 L 935,630 Z" class="district"/>
      <text x="970" y="480" class="lbl">Охта</text>

      <!-- Московский / Фрунзенский (Юг) -->
      <path d="M 440,645 L 920,655 L 950,770 L 410,770 Z" class="district"/>
      <text x="610" y="715" class="lbl">Московский / Обводный</text>

      <!-- Невский проспект и главные магистрали -->
      <path d="M 530,450 L 750,485 L 885,545" class="road"/>
      <text x="650" y="465" class="lbl" style="font-size:9px;fill:#6b7694">Невский пр.</text>
      <path d="M 650,470 L 640,615" class="road"/>

      <!-- Мосты -->
      <line x1="490" y1="395" x2="525" y2="410" class="bridge"/>
      <line x1="575" y1="365" x2="585" y2="402" class="bridge"/>
      <line x1="650" y1="355" x2="660" y2="395" class="bridge"/>
      <line x1="870" y1="450" x2="905" y2="450" class="bridge"/>

      <text x="735" y="368" class="water-lbl">Р. НЕВА</text>

      <!-- Слой для точек групп -->
      <g id="pointsLayer"></g>
    </g>
  </svg>
</div>

<script src="data.js"></script>
<script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=cv.width=innerWidth,H=cv.height=innerHeight,cx=W/2,cy=H/2,sc=1,hov=null;
onresize=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};
NODES.forEach((n,i)=>{n.x=0;n.y=i*80;n.w=220;n.h=46});

function hit(x,y){const wx=(x-cx)/sc,wy=(y-cy)/sc;return NODES.find(n=>Math.abs(wx-n.x)<=n.w/2&&Math.abs(wy-n.y)<=n.h/2)}
cv.onmousemove=e=>{hov=hit(e.clientX,e.clientY);cv.style.cursor=hov?"pointer":"default"};
cv.onclick=e=>{const h=hit(e.clientX,e.clientY);if(h)openCityMap(h)};

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function loop(){
  ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);
  NODES.forEach(n=>{
    const isH=hov&&hov.id===n.id,rx=n.x-n.w/2,ry=n.y-n.h/2;
    if(isH){ctx.beginPath();ctx.arc(n.x,n.y,90,0,6.29);ctx.fillStyle="rgba(123,142,184,0.06)";ctx.fill()}
    rr(rx,ry,n.w,n.h,9);ctx.fillStyle=isH?"#1a1e29":"#11131a";ctx.fill();
    ctx.lineWidth=isH?1.6:1;ctx.strokeStyle=isH?"#7b8eb8":"rgba(255,255,255,0.14)";ctx.stroke();
    ctx.beginPath();ctx.arc(rx+16,n.y,4,0,6.29);ctx.fillStyle="#7b8eb8";ctx.fill();
    ctx.fillStyle="#6c7280";ctx.font="10px sans-serif";ctx.textAlign="left";ctx.fillText(n.year,rx+2,ry-6);
    ctx.fillStyle="#fff";ctx.font="600 14px sans-serif";ctx.fillText(n.name,rx+28,n.y+5);
  });
  ctx.restore();requestAnimationFrame(loop);
}
loop();

// Перетаскивание и зум карты Питера
const spbSvg=document.getElementById("spbSvg"),mapLayer=document.getElementById("mapLayer");
let mx=0,my=0,ms=1,mdrag=false,mlx=0,mly=0;
function updMap(){mapLayer.setAttribute("transform",`translate(${mx},${my}) scale(${ms})`)}
spbSvg.onmousedown=e=>{mdrag=true;mlx=e.clientX;mly=e.clientY};
window.addEventListener("mousemove",e=>{if(!mdrag)return;mx+=e.clientX-mlx;my+=e.clientY-mly;mlx=e.clientX;mly=e.clientY;updMap()});
window.addEventListener("mouseup",()=>{mdrag=false});
spbSvg.onwheel=e=>{e.preventDefault();ms=Math.min(3,Math.max(0.6,ms*(e.deltaY<0?1.12:0.88)));updMap()};

function openCityMap(city){
  document.getElementById("mapView").classList.add("active");
  document.getElementById("kicker").textContent="Карта сцены • "+city.year;
  document.getElementById("mainTitle").textContent=city.name;
  document.getElementById("mainSub").textContent=city.subtitle;
  document.getElementById("backBtn").style.display="inline-block";
}
document.getElementById("backBtn").onclick=()=>{
  document.getElementById("mapView").classList.remove("active");
  document.getElementById("kicker").textContent="Audio Atlas • Сцены";
  document.getElementById("mainTitle").textContent="Музыкальная Долина";
  document.getElementById("mainSub").textContent="Нажми на «Санкт-Петербург», чтобы открыть интерактивную карту города.";
  document.getElementById("backBtn").style.display="none";
};
</script>
</body>
</html>
